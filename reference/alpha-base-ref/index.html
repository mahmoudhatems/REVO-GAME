
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>Alpha Base</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-container {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      margin: 0;
      padding: 0;

      overflow: hidden;
      background: #000;
    }

    #game-container canvas {
      display: block;

      width: 100% !important;
      height: 100% !important;

      margin: 0;
      padding: 0;

      touch-action: none;
    }

    /* رسالة توجيه الموبايل للوضع الأفقي */
    #rotate-message {
      display: none;

      position: fixed;
      inset: 0;
      z-index: 99999;

      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;

      padding: 25px;

      background: #12060a;
      color: #ffd23d;

      font-family: Arial, sans-serif;
      text-align: center;
    }

    #rotate-message .icon {
      font-size: 65px;
      animation: rotate-phone 2s infinite ease-in-out;
    }

    #rotate-message h2 {
      margin: 0;
      font-size: 24px;
    }

    #rotate-message p {
      margin: 0;
      color: #ffe9c7;
      font-size: 15px;
      line-height: 1.6;
    }

    @keyframes rotate-phone {
      0%, 100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(-90deg);
      }
    }

    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-message {
        display: flex;
      }

      #game-container canvas {
        visibility: hidden;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>

<body>

  <div id="game-container"></div>

  <div id="rotate-message">
    <div class="icon">📱</div>

    <h2>Rotate Your Device</h2>

    <p>
      Please rotate your phone to landscape mode
      for the best gaming experience.
    </p>
  </div>

  <script type="module" src="src/main.js"></script>

</body>
</html>
